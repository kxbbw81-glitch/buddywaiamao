name: V2 local quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: DATABASE_URL='postgresql://user:pass@127.0.0.1:5432/nexfab_test?schema=public' npx prisma validate
      - run: npm test && npm run test:smoke && npm run test:p0-pii-encryption && npm run test:p1-lead-import && npm run test:p1-import-templates && npm run test:p3-ops-status && npm run test:p3-backup-guard && npm run test:p3-social-acquisition && npm run test:p3-outbound-draft && npm run test:p3-analytics-report
      - run: npm run test:p2-rag && npm run test:p2-ai-gateway && npm run test:p2-ai-contract && npm run test:p2-ai-policy && npm run test:p2-ai-feedback && npm run test:p2-ai-citation && npm run test:p2-tool-call && npm run test:p2-automation && npm run test:p2-integration && npm run test:p2-dashboard && npm run test:p2-ai-async-sse && npm run test:p2-pgvector-contract
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test:p0-ui-contract && npm run test:p3-pwa-contract && npm run test:p3-social-acquisition
      - run: npm run test:p0-platform && npm run test:p1-acquisition-crm && npm run test:p1-product-quote && npm run test:p1-fulfillment-flow && npm run test:p1-import-dashboard && npm run test:p2-ai-workbench && npm run test:p3-ops-status
  backend-infra-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexfab_p2_verify
          POSTGRES_USER: nexfab_verify
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexfab_verify -d nexfab_p2_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://nexfab_verify:local_test_only@127.0.0.1:5432/nexfab_p2_verify?schema=public
      - run: npm run p2:pgvector-preflight
        env:
          DATABASE_URL: postgresql://nexfab_verify:local_test_only@127.0.0.1:5432/nexfab_p2_verify?schema=public
      - run: npm run test:p2-postgres-e2e
        env:
          NEXFAB_REAL_DB_E2E: 'true'
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://nexfab_verify:local_test_only@127.0.0.1:5432/nexfab_p2_verify?schema=public
      - run: npm run test:p3-performance-local
        env:
          NEXFAB_P3_PERF_LOCAL: 'true'
          NEXFAB_P3_LOCAL_P95_MAX_MS: '1000'
          DATABASE_URL: postgresql://nexfab_verify:local_test_only@127.0.0.1:5432/nexfab_p2_verify?schema=public
