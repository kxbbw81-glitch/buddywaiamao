# NexFab AI CRM - Docker Compose 部署配置
# 使用方法:
#   1. 复制 .env.production 为 .env 并修改配置
#   2. docker compose up -d --build
#   3. 访问 http://your-server:3000

services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexfab-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 持久化 SQLite 数据库文件
      - crm-data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nginx 反向代理 (可选，提供 HTTPS 和域名访问)
  nginx:
    image: nginx:alpine
    container_name: nexfab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      crm:
        condition: service_healthy
    profiles:
      - with-nginx

volumes:
  crm-data:
