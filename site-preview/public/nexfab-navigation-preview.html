<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexFab AI 外贸 CRM · 导航优化预览 V3.12</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1f2937; font-size: 14px; overflow: hidden;
  }

  /* ===== Header ===== */
  .header {
    height: 56px; background: #fff; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; position: relative; z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 8px; background: #185FA5;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; letter-spacing: -0.5px;
  }
  .logo-text { font-weight: 600; font-size: 15px; }
  .logo-tag {
    font-size: 11px; color: #185FA5; background: #E6F1FB;
    padding: 2px 8px; border-radius: 10px; font-weight: 500;
  }
  .header-controls { display: flex; align-items: center; gap: 12px; }

  .role-switch { display: flex; background: #f3f4f6; border-radius: 8px; padding: 3px; gap: 2px; }
  .role-btn {
    border: none; background: transparent; padding: 5px 12px; border-radius: 6px;
    font-size: 12px; color: #6b7280; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .role-btn:hover { color: #1f2937; }
  .role-btn.active { background: #fff; color: #185FA5; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  .compare-btn {
    border: 1px solid #d1d5db; background: #fff; color: #374151;
    padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .compare-btn:hover { border-color: #185FA5; color: #185FA5; }
  .compare-btn.on { background: #185FA5; border-color: #185FA5; color: #fff; }

  /* ===== Layout ===== */
  .main { display: flex; height: calc(100% - 56px); }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 232px; background: #fff; border-right: 1px solid #e5e7eb;
    display: flex; flex-direction: column; flex-shrink: 0;
    transition: width .2s;
  }
  .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px; }
  .sidebar-scroll::-webkit-scrollbar { width: 4px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

  .nav-group { margin-bottom: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-radius: 8px; cursor: pointer; color: #374151; transition: background .12s;
    user-select: none; position: relative;
  }
  .nav-item:hover { background: #f3f4f6; }
  .nav-item.active { background: #E6F1FB; color: #185FA5; font-weight: 500; }
  .nav-item.expanded { background: #f8fafc; }
  .nav-icon { width: 17px; height: 17px; flex-shrink: 0; display: flex; }
  .nav-icon svg { width: 100%; height: 100%; }
  .nav-label { flex: 1; font-size: 13px; }
  .nav-badge {
    min-width: 18px; height: 16px; border-radius: 8px; color: #fff;
    font-size: 10px; display: flex; align-items: center; justify-content: center;
    padding: 0 5px; font-weight: 500;
  }
  .badge-red { background: #E24B4A; }
  .badge-blue { background: #378ADD; }
  .badge-amber { background: #EF9F27; }
  .nav-arrow {
    width: 8px; height: 8px; border-right: 1.5px solid #9ca3af; border-bottom: 1.5px solid #9ca3af;
    transform: rotate(-45deg); transition: transform .15s; flex-shrink: 0; margin-right: 2px;
  }
  .nav-item.expanded .nav-arrow { transform: rotate(45deg); }

  .sub-list { overflow: hidden; max-height: 0; transition: max-height .2s ease; }
  .sub-list.open { max-height: 220px; }
  .sub-item {
    display: flex; align-items: center; padding: 6px 12px 6px 40px;
    font-size: 12px; color: #6b7280; cursor: pointer; border-radius: 6px;
    margin: 1px 8px 1px 4px; transition: all .12s; position: relative;
  }
  .sub-item:hover { background: #f3f4f6; color: #374151; }
  .sub-item.active { background: #E6F1FB; color: #185FA5; font-weight: 500; }
  .sub-item .nav-badge { height: 14px; min-width: 16px; font-size: 9px; }
  .sub-ai {
    font-size: 9px; color: #534AB7; background: #EEEDFE; padding: 1px 5px;
    border-radius: 4px; font-weight: 500; margin-left: 6px; flex-shrink: 0;
  }

  .sidebar-footer { border-top: 1px solid #e5e7eb; padding: 10px 8px; }
  .ai-assistant-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: linear-gradient(135deg, #EEEDFE, #f6f5ff); border: 1px solid #AFA9EC;
    border-radius: 10px; cursor: pointer; color: #534AB7; font-size: 13px; font-weight: 500;
    transition: all .15s;
  }
  .ai-assistant-btn:hover { background: #EEEDFE; }
  .ai-assistant-btn .spark { width: 16px; height: 16px; }
  .ai-assistant-btn .ai-hint { margin-left: auto; font-size: 10px; color: #7F77DD; font-weight: 400; }

  /* ===== Content ===== */
  .content { flex: 1; overflow-y: auto; padding: 24px 28px; }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  .page-head { margin-bottom: 20px; }
  .breadcrumb { font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
  .page-title { font-size: 20px; font-weight: 600; color: #111827; }
  .page-desc { font-size: 13px; color: #6b7280; margin-top: 6px; line-height: 1.6; max-width: 640px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px;
  }
  .kpi-label { font-size: 12px; color: #6b7280; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .kpi-value { font-size: 26px; font-weight: 600; color: #111827; }
  .kpi-foot { font-size: 11px; color: #9ca3af; margin-top: 6px; }
  .kpi-foot .up { color: #E24B4A; }
  .kpi-foot .down { color: #0F6E56; }

  .panel-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; }
  .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; }
  .panel-title { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .panel-title .more { font-size: 12px; color: #185FA5; font-weight: 400; cursor: pointer; }

  .task-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid #f3f4f6;
  }
  .task-item:last-child { border-bottom: none; }
  .task-pri {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .pri-red { background: #E24B4A; } .pri-blue { background: #378ADD; } .pri-gray { background: #d1d5db; } .pri-amber { background: #EF9F27; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 13px; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-meta { font-size: 11px; color: #9ca3af; margin-top: 3px; }
  .task-meta .overdue { color: #E24B4A; }
  .task-act {
    font-size: 11px; color: #185FA5; background: #E6F1FB; border: none;
    padding: 4px 10px; border-radius: 6px; cursor: pointer; flex-shrink: 0;
  }

  .approval-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid #f3f4f6;
  }
  .approval-item:last-child { border-bottom: none; }
  .approval-type {
    font-size: 11px; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; font-weight: 500;
  }
  .type-quote { color: #854F0B; background: #FAEEDA; }
  .type-order { color: #0C447C; background: #E6F1FB; }
  .type-risk { color: #A32D2D; background: #FCEBEB; }
  .approval-body { flex: 1; min-width: 0; }
  .approval-name { font-size: 13px; color: #111827; }
  .approval-meta { font-size: 11px; color: #9ca3af; margin-top: 3px; }
  .ai-risk {
    font-size: 10px; color: #A32D2D; background: #FCEBEB; padding: 1px 6px;
    border-radius: 4px; margin-left: 6px;
  }

  /* ===== V3.8 工作台最终设计方案 ===== */
  .atmo-bar { display:flex; align-items:center; background:#fff; border:1px solid #e5e7eb; border-radius:10px; height:42px; margin-bottom:14px; overflow:hidden; font-size:12px; }
  .atmo-quote { flex:1; min-width:160px; overflow:hidden; position:relative; height:100%; display:flex; align-items:center; color:#6b7280; }
  .atmo-quote .marquee { position:absolute; white-space:nowrap; animation:marquee 18s linear infinite; }
  @keyframes marquee { 0% { left:100%; } 100% { left:-100%; } }
  .atmo-item { padding:0 14px; border-left:1px solid #f0f1f3; color:#6b7280; display:flex; align-items:center; gap:6px; white-space:nowrap; height:100%; }
  .atmo-item b { font-weight:600; color:#374151; }
  .atmo-item.hot { background:#FDF3F3; color:#A32D2D; }
  .atmo-item.hot b { color:#A32D2D; }
  .atmo-select { border:1px solid #d1d5db; border-radius:6px; font-size:11px; padding:2px 4px; color:#374151; background:#fff; font-family:inherit; outline:none; cursor:pointer; }
  .atmo-hint { font-size:12px; color:#A32D2D; background:#FDF3F3; border:1px solid #F0B9B8; border-radius:8px; padding:7px 12px; margin-bottom:14px; display:none; line-height:1.6; }
  .atmo-hint.show { display:block; }

  .cap-row { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .cap { flex:1; min-width:200px; display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:12px; border:1px solid; cursor:pointer; position:relative; background:#fff; transition:transform .12s; }
  .cap:hover { transform:translateY(-1px); }
  .cap-emoji { font-size:22px; }
  .cap-num { font-size:24px; font-weight:700; color:#111827; line-height:1; }
  .cap-label { font-size:12px; color:#374151; }
  .cap-sub { font-size:11px; color:#9ca3af; margin-top:3px; }
  .cap-yellow { border-color:#F3D9A4; background:#FFFBF2; }
  .cap-red { border-color:#F0B9B8; background:#FEF6F6; }
  .cap-blue { border-color:#B9DCF5; background:#F5FAFE; }
  .cap-green { border-color:#B9E2D3; background:#F4FBF8; }
  .breath::after { content:''; position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%; background:#E24B4A; animation:breath 1.6s ease-in-out infinite; }
  @keyframes breath { 0%,100% { opacity:.3; box-shadow:0 0 0 0 rgba(226,75,74,.45); } 50% { opacity:1; box-shadow:0 0 0 6px rgba(226,75,74,0); } }

  .kpi-delta { font-size:13px; font-weight:600; }
  .kpi-delta.up { color:#E24B4A; } .kpi-delta.down { color:#0F6E56; }
  .spark { margin-top:8px; display:block; }
  .scope-tag { font-size:10px; color:#9ca3af; background:#f3f4f6; border-radius:4px; padding:1px 6px; font-weight:400; margin-left:6px; }

  .funnel-row { display:grid; grid-template-columns:1fr 118px; gap:12px; align-items:center; }
  .funnel-wrap { display:flex; justify-content:center; }
  .funnel-bar { height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
  .fb-line { font-size:11px; opacity:.95; display:flex; gap:8px; align-items:baseline; }
  .fb-amt { font-size:15px; font-weight:700; }
  .funnel-conv { display:flex; flex-direction:column; gap:3px; font-size:11px; color:#9ca3af; }
  .fc-pill { display:inline-flex; align-items:center; background:#f3f4f6; border-radius:10px; padding:2px 9px; width:max-content; color:#374151; font-weight:500; }
  .dev-up { color:#0F6E56; font-weight:600; } .dev-down { color:#E24B4A; font-weight:600; }
  .funnel-sum { margin-top:12px; padding:9px 14px; background:#FFFBF2; border:1px solid #F3D9A4; border-radius:10px; font-size:12px; color:#374151; }
  .funnel-sum b { color:#854F0B; }

  .stage-row { display:grid; grid-template-columns:44px 1fr 110px; gap:10px; align-items:center; padding:5px 0; font-size:12px; color:#374151; }
  .stage-track { height:10px; background:#f3f4f6; border-radius:5px; overflow:hidden; }
  .stage-fill { height:100%; border-radius:5px; background:#A8C5E8; }
  .stage-fill.warn { background:#EF9F27; }
  .stage-days { text-align:right; color:#6b7280; }
  .stage-days .warn { color:#B45309; font-weight:600; }

  .news-item { padding:10px 0; border-bottom:1px solid #f3f4f6; }
  .news-item:last-child { border-bottom:none; }
  .news-tag { font-size:10px; padding:1px 7px; border-radius:4px; font-weight:500; margin-right:8px; vertical-align:1px; }
  .tag-policy { color:#A32D2D; background:#FCEBEB; }
  .tag-industry { color:#854F0B; background:#FAEEDA; }
  .tag-biz { color:#0F6E56; background:#DFF2EC; }
  .tag-fx { color:#0C447C; background:#E6F1FB; }
  .tag-sys { color:#4B5563; background:#f3f4f6; }
  .news-title { font-size:13px; color:#111827; }
  .news-meta { font-size:11px; color:#9ca3af; margin-top:3px; }

  .fx-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .fx-card { border:1px solid #e5e7eb; border-radius:10px; padding:10px 12px; }
  .fx-pair { font-size:11px; color:#6b7280; display:flex; justify-content:space-between; }
  .fx-rate { font-size:16px; font-weight:600; margin-top:4px; display:flex; align-items:baseline; justify-content:space-between; color:#111827; }
  .fx-chg { font-size:11px; font-weight:600; }
  .fx-chg.up { color:#E24B4A; } .fx-chg.down { color:#0F6E56; }

  .map-wrap { position:relative; height:230px; background:linear-gradient(180deg,#F7FAFD,#F0F5FA); border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; }
  .map-grid { position:absolute; inset:0; background-image:radial-gradient(#d6dfe9 1px, transparent 1px); background-size:22px 22px; opacity:.6; }
  .map-bubble { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .map-dot { border-radius:50%; background:rgba(24,95,165,.85); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:600; box-shadow:0 0 0 5px rgba(24,95,165,.14); }
  .map-dot.risk { background:rgba(239,159,39,.92); box-shadow:0 0 0 5px rgba(239,159,39,.16); }
  .map-lbl { font-size:10px; color:#374151; margin-top:5px; background:rgba(255,255,255,.88); padding:1px 6px; border-radius:6px; white-space:nowrap; }
  .map-legend { display:flex; gap:16px; font-size:11px; color:#6b7280; margin-top:10px; align-items:center; }

  .role-mod-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .role-mod-card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:12px 14px; cursor:pointer; transition:border-color .12s; }
  .role-mod-card:hover { border-color:#85B7EB; }
  .rm-badge { font-size:10px; padding:1px 7px; border-radius:4px; font-weight:500; display:inline-block; margin-bottom:6px; }
  .rm-sales { color:#9A5B00; background:#FAEEDA; }
  .rm-manager { color:#534AB7; background:#EEEDFE; }
  .rm-finance { color:#0F6E56; background:#DFF2EC; }
  .rm-exec { color:#A32D2D; background:#FCEBEB; }
  .rm-admin { color:#4B5563; background:#f3f4f6; }
  .rm-name { font-size:13px; font-weight:600; color:#111827; }
  .rm-desc { font-size:11px; color:#9ca3af; margin-top:4px; line-height:1.6; }

  .quick-ops { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .qo-search { flex:1; min-width:220px; display:flex; align-items:center; gap:8px; border:1px solid #d1d5db; border-radius:8px; padding:8px 12px; background:#fff; }
  .qo-search input { border:none; outline:none; flex:1; font-size:13px; font-family:inherit; background:transparent; }
  .qo-btn { border:1px solid #d1d5db; background:#fff; border-radius:8px; padding:8px 14px; font-size:12px; color:#374151; cursor:pointer; font-family:inherit; transition:all .12s; }
  .qo-btn:hover { border-color:#185FA5; color:#185FA5; }
  .qo-ch { display:flex; gap:8px; margin-top:12px; }

  /* module blueprint page */
  .blueprint { max-width: 760px; }
  .bp-intro {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 20px 22px; margin-bottom: 14px;
  }
  .bp-intro h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .bp-intro p { font-size: 13px; color: #6b7280; line-height: 1.7; }
  .bp-intro .merge-info {
    margin-top: 10px; font-size: 12px; color: #185FA5; background: #E6F1FB;
    padding: 6px 12px; border-radius: 6px; display: inline-block;
  }

  .bp-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .bp-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px;
    cursor: pointer; transition: border-color .15s;
  }
  .bp-card:hover { border-color: #85B7EB; }
  .bp-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bp-card-title { font-size: 14px; font-weight: 600; color: #111827; flex: 1; }
  .bp-card p { font-size: 12px; color: #6b7280; line-height: 1.7; }
  .bp-ai {
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e5e7eb;
    font-size: 11px; color: #534AB7; line-height: 1.7;
  }
  .bp-ai b { font-weight: 500; }

  /* ===== Quick Quote (秒报价) ===== */
  .qq-form { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .qq-row { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .qq-field { flex: 1; min-width: 170px; }
  .qq-field label { font-size: 12px; color: #6b7280; display: block; margin-bottom: 6px; }
  .qq-field select, .qq-field input {
    width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 13px; outline: none; font-family: inherit; background: #fff; color: #1f2937;
  }
  .qq-field select:focus, .qq-field input:focus { border-color: #185FA5; }
  .qq-term { display: flex; gap: 6px; }
  .qq-term button {
    flex: 1; padding: 8px 0; border: 1px solid #d1d5db; background: #fff; border-radius: 8px;
    font-size: 12px; cursor: pointer; color: #6b7280; transition: all .12s; font-family: inherit;
  }
  .qq-term button.on { border-color: #185FA5; color: #185FA5; background: #E6F1FB; font-weight: 500; }
  .qq-run {
    background: #185FA5; color: #fff; border: none; padding: 10px 24px; border-radius: 8px;
    font-size: 13px; cursor: pointer; font-weight: 500; font-family: inherit; transition: background .15s;
  }
  .qq-run:hover { background: #124a82; }
  .qq-timer { font-size: 12px; color: #9ca3af; margin-left: 10px; }
  .qq-result { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; }
  .qq-loading { text-align: center; padding: 36px 0; color: #6b7280; font-size: 13px; }
  .qq-price { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  .qq-price .big { font-size: 30px; font-weight: 600; color: #111827; }
  .qq-price .unit { font-size: 13px; color: #6b7280; }
  .qq-meta { font-size: 11px; color: #9ca3af; }
  .cost-bar { height: 8px; border-radius: 4px; background: #f3f4f6; overflow: hidden; display: flex; margin: 8px 0 4px; }
  .cost-bar span { height: 100%; }
  .cost-legend { font-size: 11px; color: #6b7280; line-height: 1.9; }
  .cost-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .qq-ai {
    margin-top: 14px; padding: 12px 14px; background: #EEEDFE; border-radius: 10px;
    font-size: 12px; color: #534AB7; line-height: 1.8;
  }
  .qq-ai b { font-weight: 600; }
  .qq-actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  .qq-gen {
    background: #534AB7; color: #fff; border: none; padding: 9px 20px; border-radius: 8px;
    font-size: 12px; cursor: pointer; font-weight: 500; font-family: inherit;
  }
  .qq-gen.gray { background: #374151; }
  .qq-done { font-size: 12px; color: #0F6E56; }

  /* ===== Product KB (产品知识库) ===== */
  .pim-wrap { display: flex; gap: 14px; align-items: flex-start; }
  .pim-tree {
    width: 216px; flex-shrink: 0; background: #fff; border: 1px solid #e5e7eb;
    border-radius: 12px; padding: 14px 10px;
  }

/* ============ 侧边栏渲染 ============ */
function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  const visible = modules.filter(m => m.roles.includes(currentRole));
  // 角色切换时重置展开状态为该角色默认值
  nav.innerHTML = visible.map(m => {
    const isExp = expanded[m.id];
    const badgeHtml = m.badge
      ? `<span class="nav-badge badge-${m.badge.type}">${m.badge.n}</span>` : '';
    const arrow = m.subs.length
      ? `<span class="nav-arrow"></span>` : '';
    const subs = m.subs.map(s => {
      const b = s.badge ? `<span class="nav-badge badge-${s.badge.type}">${s.badge.n}</span>` : '';
      const ai = s.ai ? '<span class="sub-ai">AI</span>' : '';
      const dm = s.demo ? '<span class="sub-ai" style="background:#FEF0C7;color:#854F0B">▶</span>' : '';
      const act = (activePage.module === m.id && activePage.sub === s.name) ? 'active' : '';
      return `<div class="sub-item ${act}" onclick="goPage('${m.id}','${s.name}')">${s.name}${ai}${dm}${b}</div>`;
    }).join('');
    return `
      <div class="nav-group">
        <div class="nav-item ${isExp ? 'expanded' : ''}" onclick="toggleModule('${m.id}')">
          <span class="nav-icon">${icons[m.icon]}</span>
          <span class="nav-label">${m.name}</span>
          ${badgeHtml}${arrow}
        </div>
        <div class="sub-list ${isExp ? 'open' : ''}">${subs}</div>
      </div>`;
  }).join('');
}

function toggleModule(id) {
  expanded[id] = !expanded[id];
  renderSidebar();
}

function goPage(moduleId, subName) {
  activePage = { module: moduleId, sub: subName };
  expanded[moduleId] = true;
  renderSidebar();
  renderContent();
  document.getElementById('content').scrollTop = 0;
}

function daysUntil(m, d) {
  const now = new Date();
  const t = new Date(now.getFullYear(), m - 1, d);
  return Math.ceil((t - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
}

function switchCountry(c) {
  focusCountry = c;
  const h = countryHolidays[c];
  const until = daysUntil(h.m, h.d);
  const item = document.getElementById('atmoCountry');
  const hint = document.getElementById('atmoHint');
  if (item) item.innerHTML = `${h.name} ${h.m}.${h.d}·${h.days}天 还有 ${until} 天`;
  if (hint) {
    if (until <= 14) {
      hint.textContent = `${c}客户${h.name}放假 ${h.days} 天：期间客户不回复、物流停摆，报价/签单/催款请提前，在途订单交期做好预期——客户放假前是催单、发货、节日营销的黄金窗口。`;
      hint.classList.add('show');
    } else { hint.classList.remove('show'); }
  }
}

function sparkline(pts, color) {
  const w = 128, h = 26, max = Math.max(...pts), min = Math.min(...pts);
  const rng = (max - min) || 1, step = w / (pts.length - 1);
  const y = p => (h - 3 - (p - min) / rng * (h - 6)).toFixed(1);
  const pl = pts.map((p, i) => `${(i * step).toFixed(1)},${y(p)}`).join(' ');
  const li = pts.length - 1;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pl}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${(li * step).toFixed(1)}" cy="${y(pts[li])}" r="2.2" fill="${color}"/></svg>`;
}

      </div>` : '<div class="funnel-conv" style="color:#d1d5db">进入漏斗</div>';
    const bg = s.hot
      ? 'linear-gradient(180deg,#F6B352,#E8861A)'
      : `linear-gradient(180deg,hsl(214,52%,${66 - i * 4}%),hsl(214,62%,${52 - i * 4}%))`;
    return `
    <div class="funnel-row">
      <div class="funnel-wrap"><div class="funnel-bar" style="width:${s.w}%;background:${bg};clip-path:polygon(9% 0,91% 0,78% 100%,22% 100%)">
        <div class="fb-line">${s.name} ${s.n} 条<span class="fb-amt">${s.amt}</span></div>
      </div></div>

  const stayRows = stageStay.map(s => `

  const newsRows = d.news.map(n => `
      <div class="news-item">
        <span class="news-tag ${n.tag[0]}">${n.tag[1]}</span><span class="news-title">${n.title}</span>

  const fxRows = wbFxRates.map(f => `

  return `

function skCatSave() {
  const name = (document.getElementById('skCatName').value || '').trim();

  const icon = (document.getElementById('skCatIcon').value || '').trim() || '🧩';

    C.name = name; C.icon = icon; C.tag = skCatColorVal; C.tagTxt = '自定义'; C.descPlain = desc;

    goPage('aihub', name); toast('分类已重命名：' + name);

    const cid = 'c' + Date.now();

function renderPipeline() {
  const counts = plStages.map((_, i) => plDeals.filter(d => d.stage === i).length);
  const funnel = plStages.map((s, i) => {
    const rate = i === 0 ? '' : `转化 ${Math.round(counts[i] / Math.max(counts[i - 1], 1) * 100)}%`;
    return `<div class="pl-fstep"><div class="n">${counts[i]}</div><div class="t">${s}</div><div class="r">${rate}</div></div>`;
  }).join('');

  const board = plStages.map((s, i) => {
    const cards = plDeals.filter(d => d.stage === i).map(d => `
      <div class="pl-card ${plSel === d.id ? 'sel' : ''}" onclick="plPick(${d.id})">
        <div class="cust">${d.cust}<span class="pl-prob">${d.stage === 4 ? '✓' : 'AI ' + d.prob + '%'}</span></div>
        <div class="prod">${d.prod}</div>
        <div class="foot">
          <span class="amt">${d.amt}</span>
          <span class="pl-days ${d.days > 7 && d.stage !== 4 ? 'late' : ''}">${d.days === 0 ? '今天' : '停留 ' + d.days + ' 天'}</span>
        </div>
      </div>`).join('');
    return `<div class="pl-col"><div class="pl-col-head"><span>${s}</span><span class="n">${counts[i]}</span></div>${cards}</div>`;
  }).join('');

  const d = plDeals.find(x => x.id === plSel);
  const detail = !d ? '' : `
  <div class="pl-detail">
    <div class="pl-ctx">
      <div class="item"><div class="k">客户 / 国家</div><div class="v">${d.cust} · ${d.country}</div></div>
      <div class="item"><div class="k">商机来源</div><div class="v">${d.src}</div></div>
      <div class="item"><div class="k">负责人</div><div class="v">${d.owner}</div></div>
      <div class="item"><div class="k">当前阶段</div><div class="v">${plStages[d.stage]}</div></div>
      <div class="item"><div class="k">AI 成交概率</div><div class="v" style="color:#534AB7">${d.stage === 4 ? '已成交' : d.prob + '%'}</div></div>
      <div class="item"><div class="k">客户档案</div><div class="v" style="color:#185FA5;cursor:pointer" onclick="toast('演示：跳转客户档案 360° 视图（不离开商机上下文）')">查看 360° →</div></div>
    </div>
    <div style="font-size:11px;color:#9ca3af;margin:10px 0 4px">沟通时间线（商机卡内嵌，不跳回客户管理）</div>
    <div class="pl-timeline">${d.tl.map(t => `<div><span class="d">${t[0]}</span>${t[1]}</div>`).join('')}</div>
    <div class="qq-ai"><b>AI 下一步建议</b> · ${d.ai}</div>
    <div class="qq-actions">
      <button class="pl-adv" ${d.stage >= 4 ? 'disabled' : ''} onclick="plAdvance(${d.id})">推进到「${plStages[Math.min(d.stage + 1, 4)]}」</button>
      ${d.stage === 1 ? '<button class="qq-gen gray" onclick="toast(\'演示：跳转报价中心 · 引用本商机产品与历史价\')">去报价 →</button>' : ''}
      ${d.stage === 2 ? '<button class="qq-gen gray" onclick="toast(\'演示：跳转订单履约 · 样品管理\')">去寄样跟踪 →</button>' : ''}
      ${d.stage === 3 ? '<button class="qq-gen gray" onclick="toast(\'演示：跳转订单履约 · 生成 PI\')">生成 PI →</button>' : ''}
      <span class="qq-done" style="margin-left:6px">阶段推进即记录跟进，不为录商机而录商机</span>
    </div>
  </div>`;

  return `
  <div class="page-head">
    <div class="breadcrumb">商机中心 / 销售管道</div>
    <div class="page-title">销售管道</div>
    <div class="page-desc">看板推进：询盘 → 报价 → 寄样 → 谈判 → 成交。商机卡内嵌客户上下文与沟通时间线——高频操作，不藏在客户档案的折叠菜单里。点击任意卡片查看详情。</div>
  </div>
  <div class="pl-funnel">${funnel}</div>
  <div class="pl-board">${board}</div>
  ${detail}`;
}

function plPick(id) { plSel = plSel === id ? null : id; renderContent(); }
function plAdvance(id) {
  const d = plDeals.find(x => x.id === id);
  if (d.stage < 4) {
    d.stage += 1; d.days = 0;
    toast(`已推进到「${plStages[d.stage]}」并自动记录跟进`);
    renderContent();
  }
}

function dbmToken(v) { dbm.token = v ? 'ok' : ''; if (dbm.token) dbmLog('授权码校验通过'); renderContent(); }
function dbmRun() {
  dbm.running = true; dbm.idx = 0; dbm.logs = [];
  dbmLog(dbm.mode === 'migration' ? '任务开始：MySQL 迁移 · 冲突策略=跳过已有记录' : '任务开始：本地备份 · 格式 SQL.GZ');
  renderContent();
  const step = () => {
    if (dbm.idx < dbTables.length) {
      const [name, total] = dbTables[dbm.idx];
      dbmLog(`写入 ${name} … ${total.toLocaleString()} 条${dbm.idx === 3 ? '（跳过已有 45 条）' : ''}`);
      dbm.idx++;
      renderContent();
      setTimeout(step, 420);
    } else {
      dbm.running = false;
      dbmLog(dbm.mode === 'migration' ? '迁移完成：14,102 条写入 · 545 条跳过 · 0 条失败 · 耗时 4.2s' : '备份完成：nexfab-backup-0821.sql.gz · 14.6 MB · 保留 7 份策略内');
      renderContent();
      toast(dbm.mode === 'migration' ? '迁移完成：10 张表全部成功' : '备份完成：nexfab-backup-0821.sql.gz');
    }
  };
  setTimeout(step, 500);
}

function renderBlueprint(m) {
  const pc = phaseColors[m.phase];
  const cards = m.subs.map(s => {
    const aiBlock = s.ai ? `
      <div class="bp-ai"><b>AI</b> · ${aiDesc[m.id + '/' + s.name] || 'AI 能力嵌入'}</div>` : '';
    return `
    <div class="bp-card" onclick="toast('演示原型：${s.name} 页面')">
      <div class="bp-card-head">
        <div class="bp-card-title">${s.name}</div>
        ${s.badge ? `<span class="nav-badge badge-${s.badge.type}">${s.badge.n}</span>` : ''}
      </div>
      <p>${subDesc[m.id + '/' + s.name] || ''}</p>
      ${aiBlock}
    </div>`;
  }).join('');

  return `
  <div class="page-head">
    <div class="breadcrumb">${m.name}</div>
    <div class="page-title">${m.name}</div>
    <div class="page-desc">${m.intro}</div>
    <div style="margin-top:10px"><span class="merge-info" style="color:${pc}">${m.merge}</span></div>
  </div>
  <div class="blueprint"><div class="bp-list">${cards}</div></div>`;
}

/* ============ 角色切换 ============ */
function renderRoles() {
  const rs = document.getElementById('roleSwitch');
  rs.innerHTML = roles.map(r =>
    `<button class="role-btn ${r.id === currentRole ? 'active' : ''}" onclick="switchRole('${r.id}')">${r.name}</button>`
  ).join('');
}

function switchRole(id) {
  currentRole = id;
  const r = roles.find(x => x.id === id);
  expanded = {};
  r.defaults.forEach(d => expanded[d] = true);
  const vis = modules.filter(m => m.roles.includes(id));
  if (!vis.find(m => m.id === activePage.module)) {
    activePage = { module: vis[0].id, sub: vis[0].subs[0].name };
  }
  renderRoles(); renderSidebar(); renderContent();
  toast(`已切换到「${r.name}」视角 — 默认展开：${r.defaults.map(d => modules.find(m => m.id === d).name).join('、')}`);
}

function renderCompare() {
  document.getElementById('oldMenu').innerHTML = oldMenu.map(([n, cls, to]) =>
    `<div class="old-item"><span class="old-num">${n.split(' ')[0]}</span>${n.split(' ')[1]}<span class="old-tag tag-${cls}">${to}</span></div>`
  ).join('');
  document.getElementById('newMenu').innerHTML = newMenuData.map(([name, pc, subs]) => {
    const color = phaseColors[pc];
    return `<div class="new-item">
      <div class="grp"><span class="grp-dot" style="background:${color}"></span>${name}</div>
      ${subs.map(s => `<div class="grp-sub"><span class="dot">·</span>${s}</div>`).join('')}
    </div>`;
  }).join('');
}

function toggleCompare() {
  const v = document.getElementById('compareView');
  const b = document.getElementById('compareBtn');
  v.classList.toggle('show');
  b.classList.toggle('on');
  if (v.classList.contains('show') && !v.dataset.rendered) {
    renderCompare(); v.dataset.rendered = 1;
  }
}

/* ============ AI 抽屉 ============ */
function toggleAI() {
  document.getElementById('aiDrawer').classList.toggle('open');
}

function aiAsk(q) {
  document.getElementById('aiInput').value = q;
  aiSend();
}

function aiSend() {
  const input = document.getElementById('aiInput');
  const q = input.value.trim();
  if (!q) return;
  const body = document.getElementById('aiBody');
  body.insertAdjacentHTML('beforeend',
    `<div class="ai-msg"><div class="ai-bubble self">${q}</div></div>`);
  input.value = '';
  setTimeout(() => {
    body.insertAdjacentHTML('beforeend',
      `<div class="ai-msg"><div class="ai-ava">AI</div><div class="ai-bubble">${aiReply(q)}</div></div>`);
    body.scrollTop = body.scrollHeight;
  }, 500);
  body.scrollTop = body.scrollHeight;
}

function aiReply(q) {
  if (q.includes('跟进')) return '今日需重点跟进 2 个客户：① Müller GmbH（报价浏览 3 次未回复，建议电话跟进）；② TechNova Ltd（样品签收 7 天无反馈）。已为你生成跟进任务草稿，确认后加入待办。';
  if (q.includes('报价') && q.includes('利润')) return '报价 Q-2026-0831：FOB 模式，可计价成本 ¥182,400，数量梯度 5,000 件档位，目标毛利率 22%，折扣后单价 $4.87/件。费用构成：材料 61% + 包装 12% + 国内运费 8% + 固定费用分摊 19%。计算步骤与汇率快照（8/20 16:00, 7.12）可展开查看。';
  if (q.includes('邮件') || q.includes('复购')) return '已找到 4 个沉默超 60 天客户，其中 Pacific Steel 上次采购周期约 90 天，接近复购窗口。邮件草稿已生成（含上次采购产品参考与新品推荐），引用了已审核产品资料，发送前需你确认。';
  return '这是演示原型。在实际系统中，我可以：查询客户与订单、解释报价构成、起草邮件与单证、检查数据一致性。所有输出带来源引用，关键操作需人工确认。';
}

/* ============ 工具 ============ */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); toggleAI(); }
  if (e.key === 'Escape') {
    document.getElementById('aiDrawer').classList.remove('open');
    document.getElementById('compareView').classList.remove('show');
    document.getElementById('compareBtn').classList.remove('on');
  }
});
