server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.98.101.249 crm.nexfab.com ai-crm.nexfab.com;

    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    location = / {
        return 302 /new;
    }

    location = /new {
        proxy_pass http://127.0.0.1:4302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ^~ /new/uploads/ {
        alias /opt/nexfab-ai-crm/shared/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /new/ {
        proxy_pass http://127.0.0.1:4302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location = /original {
        return 302 /original/;
    }

    location ^~ /original-api/ {
        proxy_pass http://127.0.0.1:4190/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ^~ /original/ {
        alias /opt/goodjob-crm-original/ui-v41-current/;
        try_files $uri $uri/ /original/index.html;
    }
}
